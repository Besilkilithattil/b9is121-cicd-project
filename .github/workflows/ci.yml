name: Test and build container

# AI-assisted learning scaffold. Cloud deployment is added after Azure setup.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test HTTP behavior
        run: python -m pytest -q
      - name: Build Linux container
        run: docker build -t assignment-app:test .
      - name: Check the running container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name app-check -p 127.0.0.1:18080:8080 assignment-app:test
          trap 'docker logs app-check; docker rm -f app-check' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 10 --output response.html http://127.0.0.1:18080/
          grep -q 'Version ' response.html
